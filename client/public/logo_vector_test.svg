<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="deepTraceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Squircle Background -->
  <rect width="100" height="100" rx="26" fill="url(#deepTraceGrad)"/>
  
  <!-- Monitor & Content (Pure Vector) -->
  <g fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Monitor Outer Body -->
    <rect x="20" y="19" width="60" height="46" rx="5" />
    
    <!-- Vertical Divider dividing Left and Right -->
    <line x1="49" y1="19" x2="49" y2="65" />
    
    <!-- Left Participant: Head & Torso -->
    <circle cx="34.5" cy="34" r="5.5" />
    <path d="M 25 53 C 25 45.5, 44 45.5, 44 53" />
    
    <!-- Right Top: Shield -->
    <path d="M 54 26 L 68 26 C 72 26, 73 34, 69 41 C 65 47, 61 49, 61 49 C 61 49, 57 47, 53 41 C 49 34, 50 26, 54 26 Z" />
    <!-- Checkmark inside Shield -->
    <polyline points="57.5,35 60,37.5 65,32" stroke-width="2.2" />
    
    <!-- Right Horizontal Divider -->
    <line x1="49" y1="46" x2="80" y2="46" />
    
    <!-- Right Bottom Participant: Head & Torso -->
    <circle cx="64.5" cy="53" r="4.2" />
    <path d="M 57 65 C 57 59.5, 72 59.5, 72 65" />
    
    <!-- Monitor Stand -->
    <path d="M 44 65 L 41 75 L 59 75 L 56 65" />
    <line x1="36" y1="75" x2="64" y2="75" />
  </g>
</svg>