<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Google Search Console Verification -->

  <meta name="google-site-verification" content="VihAeevQSn-OUaE6jgcVSJS7jzGJZsp5AmMNuLTD4Js" />

  <!-- Canonical URL (Replace domain with your production domain) -->
  <link rel="canonical" href="https://deeptrace.example.com/" />

  <!-- Primary Meta Tags -->
  <title>DeepTrace — Secure Video Communication</title>
  <meta name="title" content="DeepTrace — Secure Video Communication" />

    content="Next-generation secure 1-to-1 video communication with real-time deepfake defense and controlled attack simulation." />

  <meta name="theme-color" content="#2563eb" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://deeptrace.example.com/" />
  <meta property="og:site_name" content="DeepTrace" />
  <meta property="og:title" content="DeepTrace — Secure Video Communication" />
