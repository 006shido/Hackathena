  <meta name="google-site-verification" content="VihAeevQSn-OUaE6jgcVSJS7jzGJZsp5AmMNuLTD4Js" />

  <!-- Primary Meta Tags -->
  <title>DeepTrace — Secure Video Communication & Real-Time Deepfake Defense</title>
  <meta name="title" content="DeepTrace — Secure Video Communication & Real-Time Deepfake Defense" />
  <meta name="description"
    content="Next-generation secure 1-to-1 video communication with real-time deepfake defense and controlled attack simulation. Protect against synthetic voice and facial identity manipulation." />

  <meta name="application-name" content="DeepTrace" />
  <meta name="theme-color" content="#2563eb" />

  <meta name="format-detection" content="telephone=no" />
